ng bàn gia công kim loại. Một chiếc vòng đệm kim loại nhỏ nhoi, hay một giọt dầu bôi trơn rỉ ra từ bệ thử động cơ tại nhà máy Unterlüß. Nó nhỏ bé đến mức một hạt bụi cơ khí cũng có thể che khuất nó trước mắt thường. Nó chẳng có quốc tịch, chẳng có lá cờ, và chưa từng xuất hiện trên các bản tin giờ vàng. Thế nhưng, chính từ tế bào cơ khí mờ nhạt ấy, một ma trận khổng lồ bắt đầu giăng ra. Một cỗ máy chiến tranh hiện đại chưa bao giờ được sinh ra từ một quốc gia duy nhất; nó là sản phẩm của sự thỏa hiệp ngầm, nơi kẻ thù buộc phải chia sẻ từng thớ thép để cùng cấu thành cỗ máy hủy diệt.","Nguồn: Phân tích ma trận quốc phòng toàn cầu."],["Quy mô","Sự lệch pha ngay từ vạch xuất phát","Phóng to tròng kính ra toàn cầu, dữ liệu SIPRI bóc trần sự lệch pha trần trụi: Mỹ đứng ở đỉnh tháp với 42% thị phần chuyển giao vũ khí toàn cầu, trong khi Nga giữ 6,8%, Đức chiếm 5,7% và Trung Quốc đạt 5,6%. Khi tổng doanh thu của 100 tập đoàn quốc phòng lớn nhất chạm mốc 679 tỷ USD, quyền lực không còn đơn thuần là ai bắn xa hơn, mà là kẻ nào nắm giữ huyết mạch của toàn bộ hệ thống chuỗi cung ứng xuyên biên giới ấy. Một khi huyết mạch ấy nghẽn lại, cả một đế chế ngàn tỷ đô sẽ chết ngạt trên bệ phóng.","Nguồn: SIPRI."],["Máy bay · 1A","Bản hợp đồng sinh tử năm 1995","Mùa đông năm 1995. Đế chế Xô Viết sụp đổ để lại Moskva trong cơn khát tiền mặt tận cùng. Theo các nguồn tin, một nét chữ ký trị giá khoảng 2,5 tỷ USD được đặt xuống: 200 bộ khung vỏ tiêm kích Su-27SK, kèm theo hệ thống điện tử và động cơ nguyên bản, được cho là đã chuyển cho Shenyang Aircraft. Đó là thương vụ cứu đói kinh tế khẩn cấp, nhưng vô tình mở ra một đại dịch chuyển công nghệ sang Đông Á.","Nguồn: AIN, Domain-B."],["Máy bay · 1B","Bóng ma J-11B và ADN phản chủ","Từ những bộ linh kiện Su-27SK nhập khẩu, dòng tiêm kích J-11A rồi J-11B ra đời. Có báo cáo rằng nhiều năm sau, giới chức Nga từng cay đắng cho rằng đứa con tinh thần của mình đã bị sao chép đến từng con ốc vít. Lịch sử công nghiệp quân sự để lại một bài học tàn nhẫn: vũ khí một khi đã xuất ngoại sẽ luôn mang theo ADN phản chủ, biến kẻ mua thành đối thủ trực tiếp trên thương trường.","Nguồn: StrategyPage, National Interest."],["Máy bay · 2A","Trái tim phản lực và buồng đốt nghìn độ","Bạn có thể sao chép bộ khung vỏ, bạn có thể vẽ lại từng đường nét khí động học của cỗ mãnh thú trên bầu trời. Nhưng ‘trái tim’ của nó — buồng đốt động cơ tuốc-bin phản lực — là một bí mật mà luyện kim thế kỷ không dễ dàng ban phát. Mọi tiêm kích đỉnh cao đều chịu sự chi phối tàn khốc của vật liệu chịu nhiệt.","Nguồn: AIN Aerospace."],["Máy bay · 2B","Bế tắc WS-10 và dưỡng khí từ nước Nga","Dù Bắc Kinh dốc lực phát triển dòng động cơ nội địa WS-10 Taihang, có báo cáo rằng áp lực thực chiến từng ép các biên đội J-11B phải cắm cúi quay lại lắp động cơ Saturn AL-31F nhập khẩu từ Nga. Ấy là nghịch lý trớ trêu của lòng tự tôn công nghiệp: vỏ máy bay là của bạn, nhưng nhịp đập bên trong vẫn phải quỳ gối xin dưỡng khí từ kẻ thù truyền kiếp.","Nguồn: National Interest, StrategyPage."],["Máy bay · 3A","F-35 và ma trận thầu phụ Đại Tây Dương","Hãy nhìn vào F-35 Lightning II — biểu tượng cho sức mạnh bá quyền Hoa Kỳ. Nhưng theo báo cáo GAO-04-554, đây là một mạng lưới thầu phụ trị giá 14 tỷ USD trải dài khắp Đại Tây Dương. Lockheed Martin chỉ là kẻ đứng tên. Động cơ Pratt & Whitney được cho là cần linh kiện GE; phần thân sau được cho là do BAE Systems cùng các đối tác Anh như Rolls-Royce góp sức chắp vá.","Nguồn: US GAO-04-554."],["Máy bay · 3B","Đôi cánh tại Ý và sự cộng sinh tàn khốc","Theo các báo cáo, trụ cột lắp ráp cánh của dòng F-35 toàn cầu được cho là nằm tại nhà máy FACO của tập đoàn Leonardo ở Cameri, Ý. Cỗ máy giết người tối tân nhất lịch sử hóa ra là một sản phẩm cộng sinh chằng chịt: thiếu đi một mũi khoan ở Nam Âu hay một nòng đúc tại Anh, siêu tiêm kích đắt giá nhất hành tinh cũng chỉ là đống sắt vụn bất động.","Nguồn: Leonardo Defense Reports, StockAlarm."],["Xe tăng · 1","Một nòng pháo định đoạt cả khối NATO","Chìm xuống bùn đất chiến trường thiết giáp, sinh mệnh của lục quân phương Tây bị trói chặt vào nòng pháo nòng trơn 120mm Rh-120 do Rheinmetall (Đức) chế tạo. Khẩu pháo ấy trang bị trên Leopard 2 của KNDS, được General Dynamics sản xuất theo giấy phép M256 cho Abrams của Mỹ, và gắn lên Challenger 3 của Anh. Sự thống nhất hỏa lực đồng nghĩa với việc gần như toàn bộ khối NATO được cho là bị buộc cổ vào một lò đúc duy nhất tại Unterlüß.","Nguồn: Rheinmetall, Joint Forces."],["Xe tăng · 2","Cuộc đua pháo 125mm và nghịch lý Seoul","Rh-120 ra đời là câu trả lời trực diện cho khẩu pháo 125mm Xô Viết trên dòng T-64 và T-72 của Uralvagonzavod. Vòng xoáy ấy kéo dài đến nay khi Hàn Quốc bùng nổ xuất khẩu pháo K9 và xe tăng K2 sang Ba Lan. Thế nhưng, có báo cáo rằng bóc lớp vỏ thép ‘Made in Korea’, nhiều cấu hình vẫn thở bằng động cơ MTU của Đức và hộp số Allison của Mỹ. Kẻ mang danh tự chủ hóa ra vẫn phải xin nguồn sống từ đế chế cũ.","Nguồn: Armada International, Reuters."],["Dòng tiền · 1","83 lô hàng và cuộc hôn nhân Lockheed - Rheinmetall","Vũ khí chạy bằng tư bản. Theo dữ liệu hải quan Mỹ, có tới 83 lô hàng được cho là đạn dược dịch chuyển trực tiếp từ Rheinmetall Waffe Munition sang American Rheinmetall. Đỉnh điểm là bản thỏa thuận (được cho là liên doanh) giữa Lockheed Martin và Rheinmetall để sản xuất hệ thống ATACMS/GMARS ngay trên đất Đức. Tư bản quốc phòng không có biên giới; nó sẵn sàng nhảy múa qua mọi chiến tuyến khi Washington bật đèn xanh.","Nguồn: Panjiva, Reuters."],["Dòng tiền · 2A","Giấc mơ thâu tóm nước Mỹ của AVIC","Trước khi các đòn cấm vận siết lại, tập đoàn nhà nước AVIC (công ty mẹ của Shenyang Aircraft) từng âm thầm thâu tóm hàng loạt biểu tượng hàng không dân dụng Mỹ: Continental Motors (2010), Cirrus (2011), và Align Aerospace (2015). Có ý kiến cho rằng tri thức cơ khí chính xác phương Tây đã bị hút ngược về phương Đông qua các thương vụ tư bản mờ đục.","Nguồn: Wikipedia (AVIC)."],["Điểm nghẽn","Hộp đen cấm vận và bài học Thổ Nhĩ Kỳ","Năm 2020, Mỹ giáng đòn cấm đầu tư vào AVIC, trong khi có báo cáo rằng Canada cắt nguồn cung thấu kính cho UAV Bayraktar TB2 của Thổ Nhĩ Kỳ. Cú sốc cấm vận được cho là không bóp chết Thổ Nhĩ Kỳ; nó kích hoạt Aselsan tự chủ thấu kính nội địa. Nghịch lý của toàn cầu hóa quân sự nằm ở đây: lệnh trừng phạt không tiêu diệt được kẻ thù, mà chỉ lột bỏ lớp vỏ lười biếng, biến họ thành những đối thủ tự chủ đáng sợ hơn.","Nguồn: US DOD Blacklist, Aselsan Reports."],["Tổng kết","Vòng lặp Ouroboros và nghịch lý chủ quyền","Ma trận hiện lên trọn vẹn: Rheinmetall nối Đức, Anh, Mỹ; AVIC và Shenyang nối Nga với phương Tây; Lockheed Martin đứng ở hai đầu tài chính và phần cứng. Đứng trước ma trận ấy, câu hỏi triết lý cất lên: Khi nhân loại dốc toàn lực chế tạo vũ khí tối tân để bảo vệ chủ quyền tuyệt đối, tại sao sự sống còn của những cỗ máy ấy lại hoàn toàn trói buộc vào sự phụ thuộc lẫn nhau giữa những kẻ thù không đội trời chung?","Nhận xét tổng hợp của tác giả."]],"ed":{"a1":"Giấy phép Su-27SK -> J-11","a2":"Động cơ AL-31F","a3":"Động cơ WS-10 nội địa","a4":"Động cơ F135 F-35","a5":"Thân sau & Thấu kính F-35","a6":"Động cơ LiftSystem F-35B","a7":"Cánh F-35 & Nhà máy FACO Cameri","t1":"Pháo 120mm Leopard 2","t2":"Giấy phép pháo M256 -> Abrams","t3":"Đối trọng pháo 125mm Xô Viết","t4":"Challenger 3 / RBSL Joint Venture","m1":"83 Lô hàng đạn dược sang Mỹ","m2":"GMARS 2023 · ATACMS MOU","m3":"AVIC Thâu tóm 2010–2015","m4":"Công ty mẹ PLA","s1":"Cấm vận thấu kính -> Tự chủ hóa UAV"},"nm":{"lm":"Lockheed Martin","gdls":"General Dynamics Land Systems","gepw":"GE · Pratt & Whitney","amrh":"American Rheinmetall","cca":"Cirrus · Continental · Align","bae":"BAE Systems","rr":"Rolls-Royce","rhm":"Rheinmetall","knds":"KNDS","leo":"Leonardo S.p.A.","su":"Sukhoi","sat":"Saturn · Salyut","uvz":"Uralvagonzavod","sh":"Shenyang Aircraft","lim":"Shenyang Liming","avic":"AVIC","asel":"Aselsan / Baykar","unt":"Unterlüß"},"pf":{"lm":[["Quốc gia","Mỹ (Bethesda, Maryland)"],["Vai trò","Gã khổng lồ công nghiệp quốc phòng lớn nhất thế giới về doanh thu."],["Sản phẩm chủ lực","Siêu tiêm kích F-35 Lightning II, F-22 Raptor, C-130 Hercules, Tên lửa ATACMS, Hệ thống HIMARS."],["Vị thế ma trận","Đóng vai trò là Prime Contractor (Nhà thầu chính) trong mạng lưới F-35, liên kết trực tiếp với hàng nghìn nhà thầu phụ tại châu Âu (BAE, Rolls-Royce, Leonardo). Trong mảng vũ khí mặt đất, liên doanh với Rheinmetall (Đức) để sản xuất pháo tên lửa GMARS/ATACMS."]],"gdls":[["Quốc gia","Mỹ (Sterling Heights, Michigan)"],["Vai trò","Nhà sản xuất xe quân sự và thiết giáp hàng đầu cho Quân đội Mỹ và đồng minh."],["Sản phẩm chủ lực","Xe tăng chủ lực M1 Abrams (M1A1, M1A2 SEPv3), Xe bọc thép Stryker."],["Vị thế ma trận","Tích hợp công nghệ nòng pháo Rh-120mm của Rheinmetall (Đức) sản xuất theo giấy phép dưới mã M256 cho toàn bộ dòng tăng Abrams từ thập niên 1980 đến nay."]],"gepw":[["Quốc gia","Mỹ (Evendale, Ohio & East Hartford, Connecticut)"],["Vai trò","Hai tập đoàn chế tạo động cơ hàng không quân sự & dân dụng quyền lực nhất hành tinh."],["Sản phẩm chủ lực","Động cơ F135 (F-35) của Pratt & Whitney; Động cơ F110 (F-16/F-15EX) và F414 (F/A-18E/F, KF-21) của GE Aerospace."],["Vị thế ma trận","Cung cấp “trái tim” phản lực cho tiêm kích thế hệ 5 của Mỹ và khối đồng minh, kiểm soát tuyệt đối công nghệ vật liệu chịu nhiệt trong buồng đốt."]],"amrh":[["Quốc gia","Mỹ (Reston, Virginia - Chi nhánh thuộc Rheinmetall Đức)"],["Vai trò","Đầu cầu mở rộng thị trường Bắc Mỹ của Rheinmetall."],["Sản phẩm chủ lực","Đạn dược cỡ lớn, pháo xe tăng, xe bọc thép KF51 Panther, dự án XM30 thay thế xe Bradley."],["Vị thế ma trận","Đóng vai trò nhận chuyển giao linh kiện, vũ khí và công nghệ từ Đức (thông qua hơn 83 lô hàng) để đấu thầu trực tiếp các hợp đồng tỷ đô của Lầu Năm Góc."]],"cca":[["Quốc gia","Mỹ"],["Vai trò","Các công ty sản xuất máy bay tư nhân, động cơ piston hàng không và linh kiện phụ trợ hàng không vũ trụ Mỹ."],["Vị thế ma trận","Từ 2010–2015, nhóm này lần lượt bị AVIC (Trung Quốc) thâu tóm, được cho là nhằm rút ngắn khoảng cách công nghệ hàng không dân dụng và chuyển giao tri thức cơ khí chính xác sang mảng quân sự."]],"bae":[["Quốc gia","Vương quốc Anh (Farnborough, Hampshire)"],["Vai trò","Tập đoàn quốc phòng lớn nhất châu Âu."],["Sản phẩm chủ lực","Tiêm kích Eurofighter Typhoon, Tàu ngầm hạt nhân lớp Dreadnought, Xe bọc thép Challenger 3 (liên doanh RBSL)."],["Vị thế ma trận","Thầu phụ cấp 1 (Tier-1 Teammate) của Lockheed Martin trong chương trình F-35 (chế tạo phần thân sau và đuôi đứng), đồng thời liên doanh với Rheinmetall lập nên Rheinmetall BAE Systems Land (RBSL) tại Anh."]],"rr":[["Quốc gia","Vương quốc Anh (London)"],["Vai trò","Nhà sản xuất động cơ hàng không và năng lượng công nghiệp hàng đầu thế giới."],["Sản phẩm chủ lực","Động cơ EJ200 (Eurofighter Typhoon), Động cơ nâng LiftSystem cho dòng tiêm kích F-35B (STOVL)."],["Vị thế ma trận","Mắt xích không thể thay thế giúp biến F-35B thành tiêm kích cất cánh ngắn và hạ cánh thẳng đứng nhờ công nghệ LiftFan độc quyền hợp tác với Lockheed Martin."]],"rhm":[["Quốc gia","Đức (Düsseldorf)"],["Vai trò","Gã khổng lồ cơ khí và đạn dược châu Âu, trụ cột vũ khí mặt đất NATO."],["Sản phẩm chủ lực","Pháo nòng trơn Rh-120mm, Xe bọc thép Lynx, Xe tăng KF51 Panther, Đạn pháo 155mm, Hệ thống phòng không Skynex."],["Vị thế ma trận","Node trung tâm nắm giữ chuẩn mực pháo xe tăng phương Tây (trang bị cho Leopard 2, Abrams, Challenger 3), sở hữu mạng lưới xuất khẩu và liên doanh bành trướng sang Mỹ (American Rheinmetall, Lockheed Martin MOU) và Anh (RBSL)."]],"knds":[["Quốc gia","Đức & Pháp"],["Hồ sơ","Liên doanh hợp nhất giữa Krauss-Maffei Wegmann (Đức) và Nexter (Pháp). Đây là thực thể nắm giữ bản quyền khung gầm xe tăng Leopard 2 và pháo CAESAR, đóng vai trò kết nối trực tiếp với nòng pháo Rh-120 của Rheinmetall."]],"su":[["Quốc gia","Nga (Moskva - Thuộc Tập đoàn Hàng không Hợp nhất UAC/Rostec)"],["Vai trò","Hãng thiết kế máy bay chiến đấu lừng danh của Nga."],["Sản phẩm chủ lực","Dòng tiêm kích Su-27, Su-30, Su-35, Tiêm kích tàng hình Su-57, Su-75 Checkmate."],["Vị thế ma trận","Khởi đầu cho chuỗi chuyển giao công nghệ hàng không sang Trung Quốc qua hợp đồng bán giấy phép lắp ráp Su-27SK (J-11) năm 1995 trị giá 2,5 tỷ USD."]],"sat":[["Quốc gia","Nga (Rybinsk / Moskva - Thuộc UEC/Rostec)"],["Vai trò","Các tổ hợp chế tạo động cơ hàng không chiến lược của Nga."],["Sản phẩm chủ lực","Động cơ AL-31F (cho Su-27/30), AL-41F1S (Su-35), AL-31FN (J-10)."],["Vị thế ma trận","“Mạch sống” động cơ duy trì năng lực tác chiến cho Không quân Nga và từng là nguồn cung động cơ chính cho tiêm kích J-11, J-10 của Trung Quốc suốt nhiều thập kỷ."]],"uvz":[["Quốc gia","Nga (Nizhny Tagil)"],["Hồ sơ","Tổ hợp chế tạo xe tăng lớn nhất thế giới của Rostec. UVZ là nơi đẻ ra các huyền thoại T-54/55, T-72, T-90M và T-14 Armata, đóng vai trò đối trọng lịch sử trực tiếp đẩy phương Tây phải chuẩn hóa pháo Rh-120mm."]],"sh":[["Quốc gia","Trung Quốc (Thẩm Dương, Liêu Ninh - Thuộc AVIC)"],["Vai trò","“Nôi” chế tạo tiêm kích chủ lực của Không quân Quân Giải phóng Nhân dân Trung Quốc (PLA)."],["Sản phẩm chủ lực","Tiêm kích J-11, Tiêm kích đa năng J-16, Tiêm kích hạm J-15, Tiêm kích tàng hình J-31/J-35."],["Vị thế ma trận","Điểm tiếp nhận chuyển giao Su-27SK từ Nga để nội địa hóa thành J-11B, đồng thời là đối tượng nghiên cứu ứng dụng các dòng động cơ AL-31F nhập khẩu lẫn WS-10 tự phát triển."]],"lim":[["Quốc gia","Trung Quốc (Shenyang, Liaoning)"],["Hồ sơ","Nhà máy đúc động cơ thuộc Tập đoàn Động cơ Hàng không Trung Quốc (AECC). Liming là nơi sản xuất dòng tuốc-bin phản lực WS-10 Taihang nhằm phá bỏ thế độc quyền kéo dài hàng thập kỷ của các tập đoàn Nga (Saturn/Salyut)."]],"avic":[["Quốc gia","Trung Quốc (Bắc Kinh)"],["Vai trò","Tập đoàn Công nghiệp Hàng không Trung Quốc - Siêu tập đoàn nhà nước nắm giữ toàn bộ hệ thống hàng không quân sự PLA."],["Vị thế ma trận","Công ty mẹ của Shenyang Aircraft (`sh`). AVIC từng thực hiện chiến lược thâu tóm các công ty hàng không Mỹ (Cirrus, Continental) từ 2010–2015 để tiếp thu công nghệ, trước khi bị Bộ Quốc phòng Mỹ đưa vào danh sách đen trừng phạt vốn (Blacklist) từ năm 2020."]],"leo":[["Quốc gia","Ý (Rome / Cameri)"],["Hồ sơ","Được cho là tập đoàn công nghiệp quốc phòng lớn thứ 8 thế giới. Leonardo vận hành nhà máy FACO tại Cameri — được cho là trung tâm duy nhất ngoài nước Mỹ có khả năng sản xuất toàn bộ cụm cánh tiêm kích F-35 và thực hiện kiểm tra kỹ thuật (FACO) cho khu vực Châu Âu và NATO."]],"asel":[["Quốc gia","Thổ Nhĩ Kỳ (Ankara / Istanbul)"],["Hồ sơ","Aselsan là gã khổng lồ điện tử quốc phòng Thổ Nhĩ Kỳ. Có báo cáo rằng khi Canada cấm vận thấu kính WESCAM năm 2020, Aselsan đã tự chủ hệ thống quang-điện tử CATS trang bị cho UAV Bayraktar TB2 của Baykar, biến Thổ Nhĩ Kỳ thành cường quốc xuất khẩu UAV độc lập."]]},"cn":{"us":"Mỹ","uk":"Anh","de":"Đức","ru":"Nga","cn":"Trung Quốc","it":"Ý","tr":"Thổ Nhĩ Kỳ"},"title":"Chuỗi cung ứng quân sự: ai nối với ai","th":{"a":"Máy bay","t":"Xe tăng","m":"Dòng tiền","s":"Điểm nghẽn"},"note":"Vị trí điểm mang tính ước lượng.","hint":"Bấm hoặc di chuột vào một công ty để xem hồ sơ và các đường nối.","stamp":"TUYỆT MẬT","hud":"CHUỖI CUNG ỨNG QUÂN SỰ // HỒ SƠ","x":"Đóng","desc":"Khám phá ma trận toàn cầu ngầm và địa chính trị đằng sau chuỗi cung ứng quân sự.","sh":{"us":"42%","de":"5,7%","ru":"6,8%","cn":"5,6%"}},"en":{"ch":[["Prologue","A Tiny Washer at the Heart of the Foundry","Look down at the machining bench. A single metal washer, or a drop of lubricant leaking from an engine test rig in Unterlüß. It is so small that a speck of industrial dust could obscure it. It bears no nationality, waves no flag, and never appears on prime-time news. Yet from that faint mechanical cell, a massive matrix begins to unfurl. A modern war machine is never born of a single nation; it is the child of covert compromise, where bitter rivals are forced to share forged steel to build a weapon of absolute destruction.","Source: Global defense matrix synthesis."],["Scale","Asymmetry from the Starting Line","Zooming out globally, SIPRI data strips away all illusion: Washington sits at the apex with a 42% share of global arms transfers, while Russia holds 6.8%, Germany 5.7%, and China 5.6%. As top 100 defense revenues hit $679 billion, power is no longer measured by artillery range, but by who controls the lifeblood of this cross-border supply matrix. Block that lifeblood, and a trillion-dollar empire suffocates on its launchpad.","Source: SIPRI."],["Aircraft · 1A","The 1995 Lifeline Contract","Winter 1995. The collapse of the Soviet Union left Moscow in desperate need of cash. According to reports, a contract worth roughly $2.5 billion was signed, reportedly licensing Shenyang Aircraft to assemble 200 Su-27SK airframes alongside original Russian avionics and engines. It was an emergency financial lifeline that inadvertently triggered a historic technology shift toward East Asia.","Source: AIN, Domain-B."],["Aircraft · 1B","The Ghost of J-11B and Reverse-Engineered DNA","From imported Su-27SK kits, the J-11A and J-11B series were born. Years later, Russian officials were reported to have complained bitterly that their flagship jet had been cloned down to the last bolt. Defense history teaches a ruthless lesson: exported weapons always carry reverse-engineering DNA, turning today’s buyer into tomorrow’s primary rival.","Source: StrategyPage, National Interest."],["Aircraft · 2A","The Jet Heartbeat and the Thousand-Degree Cage","You can copy an airframe; you can trace every aerodynamic line of an apex predator. But its beating heart—the turbine combustion chamber—is a secret that centuries of metallurgy do not surrender easily. Every top-tier fighter jet is bound by the brutal physics of heat-resistant alloys.","Source: AIN Aerospace."],["Aircraft · 2B","The WS-10 Bottleneck and Russian Oxygen","Even as Beijing poured resources into the domestic WS-10 Taihang engine, operational strain is reported to have forced J-11B squadrons back to imported Russian Saturn AL-31F powerplants. It is the cruel paradox of industrial pride: the airframe is yours, but its inner pulse still kneels to borrow oxygen from a strategic competitor.","Source: National Interest, StrategyPage."],["Aircraft · 3A","F-35 and the Transatlantic Subcontract Web","Look at the F-35 Lightning II—the ultimate symbol of American hegemony. Yet GAO-04-554 reveals a $14 billion subcontract network spanning the Atlantic. Lockheed Martin is merely the prime name on paper. Pratt & Whitney engines are said to require GE components; the aft fuselage is reportedly built by Britain’s BAE Systems, with Rolls-Royce among the UK partners.","Source: US GAO-04-554."],["Aircraft · 3B","Italian Wings and Ruthless Symbiosis","The wing assembly hub for the global F-35 fleet is said to sit at Leonardo’s FACO facility in Cameri, Italy. History’s most advanced killing machine is a deeply intertwined product of global symbiosis: remove a single drill bit from Southern Europe or a forged casing from Britain, and the world’s costliest jet becomes immobile scrap metal.","Source: Leonardo Defense Reports, StockAlarm."],["Armor · 1","One Cannon Dictating NATO’s Land Power","Descending into the mud of armored battlefields, Western land power hinges on a single focal point: Rheinmetall’s 120mm Rh-120 smoothbore gun. This cannon arms Germany’s Leopard 2, is licensed as the M256 for America’s M1 Abrams, and equips Britain’s Challenger 3. Firepower standardization means that almost the entire NATO alliance is said to be tethered to a single foundry floor in Unterlüß.","Source: Rheinmetall, Joint Forces."],["Armor · 2","The 125mm Soviet Race and the Seoul Paradox","The Rh-120 was a direct answer to Soviet 125mm smoothbore guns on Uralvagonzavod’s T-64 and T-72 tanks. That arms race continues as South Korea exports K9 howitzers and K2 tanks to Poland. Yet beneath the ‘Made in Korea’ armor, reports suggest many of these vehicles still breathe through German MTU engines and Allison transmissions. The self-reliant newcomer still relies on the old empire’s lungs.","Source: Armada International, Reuters."],["Capital · 1","83 Shipments and the Lockheed-Rheinmetall Marriage","Weapons run on capital. According to US customs data, 83 direct shipments, reportedly of heavy munitions, moved from Rheinmetall Waffe Munition to American Rheinmetall. This culminated in a reported Lockheed Martin–Rheinmetall joint agreement to build ATACMS/GMARS rocket systems on German soil. Defense capital knows no border once Washington greenlights the tech transfer.","Source: Panjiva, Reuters."],["Capital · 2A","AVIC’s Quiet Acquisition of General Aviation","Before sanctions tightened, state-owned AVIC (parent of Shenyang Aircraft) quietly bought up US aviation icons: Continental Motors (2010), Cirrus (2011), and Align Aerospace (2015). Some argue that Western precision engineering know-how was steadily absorbed eastward through opaque corporate buyouts.","Source: Wikipedia (AVIC)."],["Chokepoints","Sanction Blackboxes and the Turkish Lesson","In 2020, Washington blacklisted AVIC, while Canada is reported to have halted optronics exports for Turkey’s Bayraktar TB2 drones. The sanction shock reportedly did not crush Turkey; it is said to have forced Aselsan to develop indigenous electro-optical pods. Here lies the paradox of military globalization: sanctions rarely destroy an adversary; they strip away complacency, forging far more dangerous, self-reliant competitors.","Source: US DOD Blacklist, Aselsan Reports."],["Conclusion","The Ouroboros Loop and the Sovereignty Paradox","The matrix stands fully lit: Rheinmetall links Germany, the UK, and the US; AVIC and Shenyang bridge Russia and the West; Lockheed Martin anchors hardware and finance alike. Facing this web, a philosophical question echoes: When humanity expends vast wealth on apex weapons to protect absolute national sovereignty, why must the survival of those very machines depend entirely on mutual reliance between bitter enemies?","Author’s synthesis."]],"ed":{"a1":"Su-27SK licence → J-11","a2":"AL-31F engines","a3":"Domestic WS-10 engine","a4":"F-35 F135 engine","a5":"F-35 aft fuselage & lenses","a6":"F-35B LiftSystem engine","a7":"F-35 wings · Cameri FACO","t1":"120mm gun for Leopard 2","t2":"M256 licence → Abrams","t3":"Soviet 125mm counterweight","t4":"Challenger 3 · RBSL joint venture","m1":"83 munitions shipments to the US","m2":"GMARS 2023 · ATACMS MOU","m3":"AVIC acquisitions 2010–2015","m4":"PLA parent company","s1":"Lens ban → Turkish UAV self-reliance"},"nm":{"lm":"Lockheed Martin","gdls":"General Dynamics Land Systems","gepw":"GE · Pratt & Whitney","amrh":"American Rheinmetall","cca":"Cirrus · Continental · Align","bae":"BAE Systems","rr":"Rolls-Royce","rhm":"Rheinmetall","knds":"KNDS","leo":"Leonardo S.p.A.","su":"Sukhoi","sat":"Saturn · Salyut","uvz":"Uralvagonzavod","sh":"Shenyang Aircraft","lim":"Shenyang Liming","avic":"AVIC","asel":"Aselsan / Baykar","unt":"Unterlüß"},"pf":{"lm":[["Country","United States (Bethesda, Maryland)"],["Role","World’s largest defense contractor by revenue."],["Core Products","F-35 Lightning II, F-22 Raptor, C-130 Hercules, ATACMS missiles, HIMARS."],["Matrix Position","Serves as Prime Contractor for the global F-35 program, connecting thousands of European suppliers (BAE, Rolls-Royce, Leonardo). In land systems, partnered with Rheinmetall (Germany) for GMARS/ATACMS rocket systems."]],"gdls":[["Country","United States (Sterling Heights, Michigan)"],["Role","Premier manufacturer of armored fighting vehicles for the US military and allies."],["Core Products","M1 Abrams Main Battle Tank (M1A1, M1A2 SEPv3), Stryker AFV."],["Matrix Position","Integrated licensed Rheinmetall Rh-120mm smoothbore technology (designated M256) into all Abrams tanks since the 1980s."]],"gepw":[["Country","United States (Ohio & Connecticut)"],["Role","Dominant global military and civil aero-engine manufacturers."],["Core Products","Pratt & Whitney F135 (F-35); GE Aerospace F110 (F-16/F-15EX) and F414 (F/A-18E/F, KF-21)."],["Matrix Position","Powers 5th-generation US and allied fighters, controlling core heat-resistant metallurgy technology inside combustion chambers."]],"amrh":[["Country","United States (Reston, Virginia - Subsidiary of Rheinmetall AG)"],["Role","Rheinmetall’s North American expansion vector."],["Core Products","Large-caliber ammunition, tank guns, KF51 Panther armor, XM30 Infantry Combat Vehicle program."],["Matrix Position","Receives components, weapons, and technology transfers from Germany (via 83+ direct customs shipments) to compete for major Pentagon contracts."]],"cca":[["Country","United States"],["Role","US general aviation aircraft manufacturers, piston engine builders, and aerospace hardware suppliers."],["Matrix Position","Acquired by AVIC (China) between 2010 and 2015, reportedly to absorb civil aviation technology and transfer precision engineering expertise to military aerospace sectors."]],"bae":[["Country","United Kingdom (Farnborough, Hampshire)"],["Role","Largest defense contractor in Europe."],["Core Products","Eurofighter Typhoon, Dreadnought-class nuclear submarines, Challenger 3 MBT (via RBSL joint venture)."],["Matrix Position","Tier-1 teammate on the Lockheed Martin F-35 program (producing aft fuselage and empennage), and co-owner of Rheinmetall BAE Systems Land (RBSL) in the UK."]],"rr":[["Country","United Kingdom (London)"],["Role","World-leading aero-engine and power systems industrialist."],["Core Products","EJ200 engine (Eurofighter Typhoon), LiftSystem propulsion for F-35B STOVL variants."],["Matrix Position","Essential supplier enabling short takeoff and vertical landing on the F-35B through proprietary LiftFan technology engineered with Lockheed Martin."]],"rhm":[["Country","Germany (Düsseldorf)"],["Role","European land systems and ammunition superpower; pillar of NATO ground force hỏa lực."],["Core Products","Rh-120mm smoothbore gun, Lynx IFV, KF51 Panther MBT, 155mm artillery shells, Skynex air defense."],["Matrix Position","Central node setting Western tank gun standards (Leopard 2, Abrams, Challenger 3), holding extensive export and joint-venture ties across the US (American Rheinmetall, Lockheed Martin MOU) and UK (RBSL)."]],"knds":[["Country","Germany & France"],["Profile","Holding company combining Krauss-Maffei Wegmann (Germany) and Nexter (France). KNDS controls Leopard 2 chassis designs and CAESAR artillery, linking directly with Rheinmetall’s 120mm gun systems."]],"su":[["Country","Russia (Moscow - Unit of UAC / Rostec)"],["Role","Legendary Russian fighter aircraft design bureau."],["Core Products","Su-27, Su-30, Su-35 air superiority fighters, Su-57 stealth fighter, Su-75 Checkmate."],["Matrix Position","Initiated key aerospace technology transfers to China via the 1995 $2.5 billion Su-27SK licensing deal (J-11 baseline)."]],"sat":[["Country","Russia (Rybinsk / Moscow - Units of UEC / Rostec)"],["Role","Russia’s strategic military turbine engine production complexes."],["Core Products","AL-31F (Su-27/30), AL-41F1S (Su-35), AL-31FN (J-10)."],["Matrix Position","Critical propulsion lifeline powering Russian aerospace forces and acting as the primary engine supply for China’s J-11 and J-10 fleets over multiple decades."]],"uvz":[["Country","Russia (Nizhny Tagil)"],["Profile","Rostec’s massive armor facility, the world’s largest tank plant by volume. UVZ produced the iconic T-54/55, T-72, T-90M, and T-14 Armata, acting as the historical counterweight that forced NATO gun standardization."]],"sh":[["Country","China (Shenyang, Liaoning - Subsidiary of AVIC)"],["Role","Major fighter jet manufacturing hub for the People’s Liberation Army Air Force (PLAAF)."],["Core Products","J-11, J-16 multirole fighter, J-15 carrier jet, J-31/J-35 stealth platform."],["Matrix Position","Key node receiving Su-27SK technology from Russia to localize into the J-11B, testing grounds for imported AL-31F engines and domestic WS-10 powerplants."]],"lim":[["Country","China (Shenyang, Liaoning)"],["Profile","Aero-engine manufacturing hub under AECC. Liming builds the WS-10 Taihang turbofan series in a decades-long push to break reliance on Russian engine suppliers (Saturn/Salyut)."]],"avic":[["Country","China (Beijing)"],["Role","State-owned aerospace giant overseeing all PLA military aviation manufacturing."],["Matrix Position","Parent enterprise of Shenyang Aircraft (`sh`). AVIC acquired US aviation firms (Cirrus, Continental) from 2010 to 2015 to absorb aerospace tech, prior to being placed on US Department of Defense capital blacklists in 2020."]],"leo":[["Country","Italy (Rome / Cameri)"],["Profile","Reportedly the 8th largest defense contractor globally. Leonardo operates the FACO facility in Cameri—said to be the only site outside the US capable of manufacturing full F-35 wing assemblies and performing final assembly/check-out for Europe and NATO."]],"asel":[["Country","Turkey (Ankara / Istanbul)"],["Profile","Aselsan is Turkey’s defense electronics leader. Following Canada’s reported 2020 export ban on WESCAM pods, Aselsan is said to have developed the indigenous CATS electro-optical system for Baykar’s Bayraktar TB2, turning Turkey into an independent UAV export power."]]},"cn":{"us":"United States","uk":"United Kingdom","de":"Germany","ru":"Russia","cn":"China","it":"Italy","tr":"Turkey"},"title":"The Military Supply Chain: Who Connects to Whom","th":{"a":"Aircraft","t":"Armor","m":"Capital","s":"Chokepoints"},"note":"Dot positions are approximate.","hint":"Click or hover a company for its profile and links.","stamp":"TOP SECRET","hud":"MILITARY SUPPLY CHAIN // DOSSIER","x":"Close","desc":"Exploring the hidden global networks and geopolitics of the military supply chain.","sh":{"us":"42%","de":"5.7%","ru":"6.8%","cn":"5.6%"}}},NS='http://www.w3.org/2000/svg',lang='vi',cur=0,act={a:1,t:1,m:1,s:1},TH={a:'air',t:'tank',m:'money',s:'sanc'},BL={w:'west',e:'east',n:'neu'},N=X.CH.length;
